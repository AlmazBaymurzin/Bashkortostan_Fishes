    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ СТРАНИЦЫ ===== */
        .fish-page {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
        }

        /* Двухколоночная сетка */
        .fish-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        /* Левая колонка — фото */
        .fish-photo-section {
            display: flex;
            flex-direction: column;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: #e8ecf0;
            margin-bottom: 16px;
        }
        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            z-index: 10;
        }
        .carousel-btn:hover {
            background: white;
        }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel-dot.active {
            background: white;
        }

        /* Правая колонка — информация */
        .fish-info-section {
            display: flex;
            flex-direction: column;
        }

        .fish-page-name {
            font-size: 32px;
            font-weight: 800;
            color: #0a2e4a;
            margin: 0 0 4px;
            line-height: 1.1;
        }

        .fish-page-latin {
            font-size: 16px;
            font-style: italic;
            color: #7a8a9a;
            margin-bottom: 8px;
        }

        .fish-page-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        /* Характеристики — компактно */
        .fish-specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .spec-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid #e8ecf0;
        }
        .spec-item:last-child,
        .spec-item:nth-last-child(2) {
            border-bottom: none;
        }
        .spec-label {
            color: #7a8a9a;
            font-weight: 500;
        }
        .spec-value {
            font-weight: 600;
            color: #0a2e4a;
            text-align: right;
        }

        /* ===== КАЛЕНДАРИ ===== */
        .fish-calendars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .fish-calendar-block {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
        }
        .fish-calendar-block h4 {
            font-size: 13px;
            font-weight: 700;
            color: #0a2e4a;
            margin: 0 0 8px;
        }
        .calendar-row {
            display: flex;
            gap: 3px;
        }
        .calendar-month {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 24px;
        }
        .calendar-month .month-label {
            font-size: 8px;
            font-weight: 600;
            color: #7a8a9a;
            text-transform: uppercase;
        }
        .calendar-month .month-box {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px solid #e0e4e8;
            background: #f0f2f5;
            transition: all 0.2s ease;
        }
        .calendar-month .month-box.activity-on {
            background: #2e7d32;
            border-color: #2e7d32;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.3);
        }
        .calendar-month .month-box.spawn-on {
            background: #c62828;
            border-color: #c62828;
            box-shadow: 0 2px 6px rgba(198, 40, 40, 0.3);
        }
        .calendar-legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #4a5a6a;
            margin-top: 8px;
        }
        .calendar-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .calendar-legend .dot.green { background: #2e7d32; }
        .calendar-legend .dot.red { background: #c62828; }
        .calendar-legend .dot.gray { background: #f0f2f5; border: 1px solid #e0e4e8; }

        /* ===== РЫБАЦКИЕ СЕКРЕТЫ (КОМПАКТНО) ===== */
        .fish-secrets {
            background: #f0f7fc;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #d4e0ff;
        }
        .fish-secrets h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0a2e4a;
            margin: 0 0 12px;
        }
        .secret-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .secret-icon {
            font-size: 16px;
            flex-shrink: 0;
        }
        .secret-content {
            flex: 1;
        }
        .secret-label {
            font-size: 13px;
            font-weight: 700;
            color: #1a5276;
            margin-bottom: 2px;
        }
        .secret-value {
            font-size: 13px;
            color: #2a3a4a;
            line-height: 1.5;
        }
        .secret-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .secret-tag {
            background: white;
            border: 1px solid #d4e0ff;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #1a5276;
        }

        /* ===== ИНТЕРЕСНЫЕ ФАКТЫ ===== */
        .fish-facts {
            background: #fef9e7;
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #f1c40f;
            margin-top: 16px;
        }
        .fish-facts h4 {
            font-size: 14px;
            font-weight: 700;
            color: #0a2e4a;
            margin-bottom: 8px;
        }
        .fish-facts ul {
            list-style: none;
            padding: 0;
        }
        .fish-facts ul li {
            padding: 4px 0 4px 24px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23f1c40f" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>') left center no-repeat;
            background-size: 16px;
            font-size: 14px;
            color: #2a3a4a;
        }

        /* ===== КНОПКА НАЗАД ===== */
        .back-button {
            display: inline-block;
            padding: 8px 24px;
            background: #f0f2f5;
            border-radius: 30px;
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            margin-top: 20px;
        }
        .back-button:hover {
            background: #e0e4e8;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 820px) {
            .fish-layout {
                grid-template-columns: 1fr;
            }
            .carousel-container {
                height: 280px;
            }
        }
        @media (max-width: 640px) {
            .fish-page {
                padding: 16px;
            }
            .carousel-container {
                height: 220px;
            }
            .fish-page-name {
                font-size: 24px;
            }
            .fish-calendars {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        <div class="container">

                <a href="index.html" class="logo" style="text-decoration:none;">
                    <span class="logo-icon">🐟</span>

    <main class="main-content">

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

        function getFishId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadFishPage() {
            const fishId = getFishId();
            const pageContainer = document.getElementById('fishPage');
            
            if (!fishId) {
                pageContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Рыба не найдена</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('data/fishes.json');
                if (!response.ok) throw new Error(`Ошибка загрузки: ${response.status}`);
                const data = await response.json();
                const fish = data.fishes.find(f => f.id === fishId);

                if (!fish) {
                    pageContainer.innerHTML = `
                        <div style="text-align:center;padding:40px;">
                            <h2>⚠️ Рыба не найдена</h2>
                            <p style="color:#7a8a9a;">Вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                        </div>
                    `;
                    return;
                }

                document.title = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('pageTitle').textContent = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('breadcrumbFish').textContent = fish.name;

                const desc = `${fish.name} — описание, фото, места обитания, размеры, интересные факты, календарь клёва и нереста.`;
                const keywords = `${fish.name}, рыбы россии, рыбы башкортостана, рыбалка, ${fish.family || ''}, календарь клёва, нерест`;
                
                document.querySelector('meta[name="description"]').setAttribute('content', desc);
                document.querySelector('meta[name="keywords"]').setAttribute('content', keywords);
                document.querySelector('meta[property="og:title"]').setAttribute('content', `${fish.name} — Рыбы России и Башкортостана`);
                document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
                document.querySelector('meta[property="og:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${fish.name} — Рыбы России и Башкортостана`);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);
                document.querySelector('meta[name="twitter:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);

                let statusLabel = fish.status || 'Промысловая';
                let statusClass = 'tag-promyslovaya';
                if (statusLabel.includes('краснокнижная')) {
                    statusClass = 'tag-red';
                    statusLabel = 'Красная книга ⚠️';
                }

                // Карусель
                let carouselHTML = '';
                const images = fish.images && fish.images.length > 0 ? fish.images : [fish.thumb || 'img/placeholder.jpg'];
                
                if (images.length === 1) {
                    carouselHTML = `
                        <div class="carousel-container" style="background:transparent;box-shadow:none;">
                            <img src="${images[0]}" alt="${fish.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;" onerror="this.src='img/placeholder.jpg'" />
                        </div>
                    `;
                } else {
                    carouselHTML = `
                        <div class="carousel-container" id="carouselContainer">
                            <div class="carousel-slides" id="carouselSlides">
                                ${images.map(img => `
                                    <div class="carousel-slide">
                                        <img src="${img}" alt="${fish.name}" loading="lazy" onerror="this.src='img/placeholder.jpg'" />
                                    </div>
                                `).join('')}
                            </div>
                            <button class="carousel-btn prev" onclick="changeSlide(-1)">‹</button>
                            <button class="carousel-btn next" onclick="changeSlide(1)">›</button>
                            <div class="carousel-dots" id="carouselDots">
                                ${images.map((_, idx) => `<button class="carousel-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></button>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // Календари
                function renderCalendar(dataArray, className) {
                    if (!dataArray || dataArray.length !== 12) return '';
                    return `
                        <div class="calendar-row">
                            ${dataArray.map((val, idx) => `
                                <div class="calendar-month">
                                    <span class="month-label">${MONTHS_SHORT[idx]}</span>
                                    <div class="month-box ${val === 1 ? className : ''}"></div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                // Рыбацкие секреты
                function renderSecrets(fish) {
                    if (!fish.bait && !fish.lure && !fish.tackle && !fish.technique && !fish.tips) return '';
                    
                    let secretsHTML = `<div class="fish-secrets"><h3>🎣 Рыбацкие секреты</h3>`;
                    
                    if (fish.bait && fish.bait.length > 0) {
                        secretsHTML += `
                            <div class="secret-row">
                                <span class="secret-icon">🪝</span>
                                <div class="secret-content">
                                    <div class="secret-label">На что клюёт:</div>
                                    <div class="secret-tags">
                                        ${fish.bait.map(b => `<span class="secret-tag">${escapeHtml(b)}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    
                    if (fish.lure) {
                        secretsHTML += `
                            <div class="secret-row">
                                <span class="secret-icon">🏷️</span>
                                <div class="secret-content">
                                    <div class="secret-label">Лучшие приманки:</div>
                                    <div class="secret-value">${escapeHtml(fish.lure)}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    if (fish.tackle) {
                        secretsHTML += `
                            <div class="secret-row">
                                <span class="secret-icon">🎣</span>
                                <div class="secret-content">
                                    <div class="secret-label">Снасти:</div>
                                    <div class="secret-value">${escapeHtml(fish.tackle)}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    if (fish.technique) {
                        secretsHTML += `
                            <div class="secret-row">
                                <span class="secret-icon">📋</span>
                                <div class="secret-content">
                                    <div class="secret-label">Техника:</div>
                                    <div class="secret-value">${escapeHtml(fish.technique)}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    if (fish.tips) {
                        secretsHTML += `
                            <div class="secret-row">
                                <span class="secret-icon">💡</span>
                                <div class="secret-content">
                                    <div class="secret-label">Советы:</div>
                                    <div class="secret-value">${escapeHtml(fish.tips)}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    secretsHTML += `</div>`;
                    return secretsHTML;
                }

                // Собираем страницу
                pageContainer.innerHTML = `
                    <div class="fish-layout">
                        <!-- Левая колонка: фото + факты -->
                        <div class="fish-photo-section">
                            ${carouselHTML}
                            ${fish.funFacts && fish.funFacts.length > 0 ? `
                            <div class="fish-facts">
                                <h4>💡 Интересные факты</h4>
                                <ul>
                                    ${fish.funFacts.map(fact => `<li>${fact}</li>`).join('')}
                                </ul>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Правая колонка: инфо + календари + секреты -->
                        <div class="fish-info-section">
                            <h1 class="fish-page-name">${fish.name}</h1>
                            <div class="fish-page-latin">${fish.latin || ''}</div>
                            <div class="fish-page-tags">
                                <span class="tag ${statusClass}">${statusLabel}</span>
                                <span class="tag">${fish.family || ''}</span>
                            </div>

                            <div class="fish-specs-grid">
                                <div class="spec-item"><span class="spec-label">Размер</span><span class="spec-value">${fish.size || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Вес</span><span class="spec-value">${fish.weight || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Питание</span><span class="spec-value">${fish.diet || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Места</span><span class="spec-value">${Array.isArray(fish.habitat) ? fish.habitat.join(', ') : '—'}</span></div>

        // ========== ЛОГИКА КАРУСЕЛИ ==========
        let currentSlide = 0;
        let totalSlides = 0;
        let slideInterval = null;

        function initCarousel(count) {
            totalSlides = count;
            updateCarousel();
            slideInterval = setInterval(() => changeSlide(1), 4000);
            const container = document.getElementById('carouselContainer');
            if (container) {
                container.addEventListener('mouseenter', () => clearInterval(slideInterval));
                container.addEventListener('mouseleave', () => {
                    slideInterval = setInterval(() => changeSlide(1), 4000);
                });
            }
        }

        function changeSlide(direction) {
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        function updateCarousel() {
            const slidesContainer = document.getElementById('carouselSlides');
            const dots = document.querySelectorAll('.carousel-dot');
            if (slidesContainer) {
                slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });
        }

        document.addEventListener('DOMContentLoaded', loadFishPage);
    </script>
