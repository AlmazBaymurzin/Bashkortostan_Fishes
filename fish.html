<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Рыбы Башкортостана</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo" style="text-decoration:none;">
                    <span class="logo-icon">🐟</span>
                    <span class="logo-text">Рыбы <span class="logo-accent">Башкортостана</span></span>
                </a>
                <div class="header-controls">
                    <a href="index.html" style="color:#1a5276;font-weight:600;font-size:15px;">← На главную</a>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <main class="main-content">
        <div class="container">
            <!-- Хлебные крошки -->
            <div class="breadcrumbs">
                <a href="index.html">Главная</a> / <span id="breadcrumbFish">Рыба</span>
            </div>

            <!-- Карточка рыбы -->
            <div class="fish-page" id="fishPage">
                <div style="text-align:center;padding:40px;">Загрузка данных...</div>
            </div>
        </div>
    </main>

    <!-- ===== ПОДВАЛ ===== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-info">
                    <p>🐟 Справочник рыб Республики Башкортостан</p>
                    <p class="footer-small">Данные основаны на открытых источниках и Красной книге РБ</p>
                </div>
                <div class="footer-links">
                    <a href="about.html">О проекте</a>
                    <a href="mailto:info@fish-bashkortostan.ru">Контакты</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- ===== СКРИПТЫ ===== -->
    <script>
        // Получаем ID рыбы из URL
        function getFishId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Загружаем данные и показываем страницу
        async function loadFishPage() {
            const fishId = getFishId();
            if (!fishId) {
                document.getElementById('fishPage').innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Рыба не найдена</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('data/fishes.json');
                const data = await response.json();
                const fish = data.fishes.find(f => f.id === fishId);

                if (!fish) {
                    document.getElementById('fishPage').innerHTML = `
                        <div style="text-align:center;padding:40px;">
                            <h2>⚠️ Рыба не найдена</h2>
                            <p style="color:#7a8a9a;">Вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                        </div>
                    `;
                    return;
                }

                // Обновляем заголовок страницы
                document.title = `${fish.name} — Рыбы Башкортостана`;
                document.getElementById('pageTitle').textContent = `${fish.name} — Рыбы Башкортостана`;
                document.getElementById('breadcrumbFish').textContent = fish.name;

                // Статус на русском
                const statusMap = {
                    'promyslovaya': 'Промысловая',
                    'lyubitelskaya': 'Любительская',
                    'red_book': 'Красная книга ⚠️'
                };
                const statusLabel = statusMap[fish.status] || fish.status;
                let statusClass = fish.status === 'red_book' ? 'tag-red' : 
                                 fish.status === 'promyslovaya' ? 'tag-promyslovaya' : '';

                // Строим HTML
                const page = document.getElementById('fishPage');
                page.innerHTML = `
                    <!-- Верхняя часть: фото и информация -->
                    <div class="fish-page-top">
                        <div class="fish-page-image">
                            <img src="${fish.images && fish.images[0] ? fish.images[0] : fish.thumb}" 
                                 alt="${fish.name}" 
                                 onerror="this.src='img/placeholder.jpg'" />
                        </div>
                        <div class="fish-page-info">
                            <h1 class="fish-page-name">${fish.name}</h1>
                            <div class="fish-page-latin">${fish.latin}</div>
                            <div class="fish-page-tags">
                                <span class="tag ${statusClass}">${statusLabel}</span>
                                <span class="tag">${fish.family}</span>
                                <span class="tag">${fish.order}</span>
                            </div>
                            <p class="fish-page-desc">${fish.description || 'Описание отсутствует.'}</p>
                            <div class="fish-page-specs">
                                <div class="spec-item"><span class="spec-label">Размер</span><span class="spec-value">${fish.size}</span></div>
                                <div class="spec-item"><span class="spec-label">Вес</span><span class="spec-value">${fish.weight}</span></div>
                                <div class="spec-item"><span class="spec-label">Тип питания</span><span class="spec-value">${fish.diet === 'хищник' ? '🦈 Хищник' : '🐟 Мирная'}</span></div>
                                <div class="spec-item"><span class="spec-label">Места обитания</span><span class="spec-value">${fish.habitats.join(', ')}</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Галерея -->
                    ${fish.images && fish.images.length > 1 ? `
                    <div class="fish-gallery">
                        <h3>📸 Фотографии</h3>
                        <div class="gallery-grid">
                            ${fish.images.map(img => `
                                <img src="${img}" alt="${fish.name}" loading="lazy" onerror="this.style.display='none'" />
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <!-- Интересные факты -->
                    ${fish.funFacts && fish.funFacts.length > 0 ? `
                    <div class="fish-facts">
                        <h4>💡 Интересные факты</h4>
                        <ul>
                            ${fish.funFacts.map(fact => `<li>${fact}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}

                    <!-- Кнопка назад -->
                    <div style="margin-top:24px;">
                        <a href="index.html" style="display:inline-block;padding:10px 28px;background:#f0f2f5;border-radius:30px;color:#1a1a1a;font-weight:600;text-decoration:none;transition:background 0.2s;" 
                           onmouseover="this.style.background='#e0e4e8'" 
                           onmouseout="this.style.background='#f0f2f5'">
                            ← Назад к списку
                        </a>
                    </div>
                `;

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('fishPage').innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Ошибка загрузки</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, попробуйте позже.</p>
                    </div>
                `;
            }
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', loadFishPage);
    </script>
</body>
</html>
