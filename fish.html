    <style>
        /* Стили для карусели */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #e8ecf0;
        }
        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            z-index: 10;
        }
        .carousel-btn:hover {
            background: white;
        }
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel-dot.active {
            background: white;
        }
        .fish-page-image {
            flex: 0 0 45%;
        }
        @media (max-width: 820px) {
            .fish-page-top {
                flex-direction: column;
            }
            .fish-page-image {
                flex: unset;
            }
            .carousel-container {
                height: 280px;
            }
        }
        @media (max-width: 640px) {
            .carousel-container {
                height: 220px;
            }
            .carousel-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
        }
        
        /* Стили для блока "Рыбацкие секреты" */
        .fish-secrets {
            background: #f0f7fc;
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            border: 1px solid #d4e0ff;
        }
        .fish-secrets h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0a2e4a;
            margin-bottom: 16px;
        }
        .secret-block {
            margin-bottom: 16px;
        }
        .secret-label {
            font-size: 14px;
            font-weight: 700;
            color: #1a5276;
            margin-bottom: 4px;
        }
        .secret-value {
            font-size: 15px;
            color: #2a3a4a;
            line-height: 1.6;
        }
        .secret-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .secret-tag {
            background: white;
            border: 1px solid #d4e0ff;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #1a5276;
        }

        /* Стили для FAQ */
        .fish-faq {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .fish-faq h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0a2e4a;
            margin-bottom: 12px;
        }
        .faq-item {
            margin-bottom: 10px;
        }
        .faq-item summary {
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #1a5276;
            margin-bottom: 4px;
        }
        .faq-item p {
            font-size: 14px;
            color: #2a3a4a;
            margin: 0;
            padding-left: 16px;
        }

        /* ===== СТИЛИ ДЛЯ КАЛЕНДАРЕЙ ===== */
        .fish-calendars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .fish-calendar-block {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
        }
        .fish-calendar-block h4 {
            font-size: 13px;
            font-weight: 700;
            color: #0a2e4a;
            margin: 0 0 8px;
        }
        .calendar-row {
            display: flex;
            gap: 3px;
        }
        .calendar-month {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 24px;
        }
        .calendar-month .month-label {
            font-size: 8px;
            font-weight: 600;
            color: #7a8a9a;
            text-transform: uppercase;
        }
        .calendar-month .month-box {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px solid #e0e4e8;
            background: #f0f2f5;
            transition: all 0.2s ease;
        }
        .calendar-month .month-box.activity-on {
            background: #2e7d32;
            border-color: #2e7d32;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.3);
        }
        .calendar-month .month-box.spawn-on {
            background: #c62828;
            border-color: #c62828;
            box-shadow: 0 2px 6px rgba(198, 40, 40, 0.3);
        }
        .calendar-legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #4a5a6a;
            margin-top: 8px;
        }
        .calendar-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .calendar-legend .dot.green { background: #2e7d32; }
        .calendar-legend .dot.red { background: #c62828; }
        .calendar-legend .dot.gray { background: #f0f2f5; border: 1px solid #e0e4e8; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo" style="text-decoration:none;">
                    <span class="logo-icon">🐟</span>
                    <span class="logo-text">Рыбы <span class="logo-accent">Башкортостана</span></span>
                </a>
                <div class="header-controls">
                    <a href="index.html" style="color:#1a5276;font-weight:600;font-size:15px;">← На главную</a>
                </div>
            </div>

    </header>

    <main class="main-content">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a> / <span id="breadcrumbFish">Рыба</span>
            </div>
            <div class="fish-page" id="fishPage">
                <div style="text-align:center;padding:40px;">⏳ Загрузка данных...</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-info">
                    <p>🐟 Справочник рыб Республики Башкортостан</p>
                    <p class="footer-small">Данные основаны на открытых источниках и Красной книге Республики Башкортостан</p>
                </div>
                <div class="footer-links">
                    <a href="contacts.html">Контакты</a>
                    <a href="privacy.html">Политика конфиденциальности</a>
                    <a href="about.html">О проекте</a>
                    <a href="mailto:krypton-mail@mail.ru">Почта</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

        function getFishId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadFishPage() {
            const fishId = getFishId();
            const pageContainer = document.getElementById('fishPage');
            
            if (!fishId) {
                pageContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Рыба не найдена</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('data/fishes.json');
                if (!response.ok) throw new Error(`Ошибка загрузки: ${response.status}`);
                const data = await response.json();
                const fish = data.fishes.find(f => f.id === fishId);

                if (!fish) {
                    pageContainer.innerHTML = `
                        <div style="text-align:center;padding:40px;">
                            <h2>⚠️ Рыба не найдена</h2>
                            <p style="color:#7a8a9a;">Вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                        </div>
                    `;
                    return;
                }

                // Обновляем мета-теги динамически под конкретную рыбу
                document.title = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('pageTitle').textContent = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('breadcrumbFish').textContent = fish.name;

                // Расширенный description с учётом рыбы
                const fishName = fish.name || 'Рыба';
                const fishFamily = fish.family || '';
                const fishHabitat = Array.isArray(fish.habitat) ? fish.habitat.join(', ') : 'различные водоемы';
                const fishSize = fish.size || 'различные размеры';
                const fishWeight = fish.weight || 'различный вес';
                
                const desc = `${fishName} (${fish.latin || ''}) — описание, фото, места обитания (${fishHabitat}), размеры (${fishSize}), вес (${fishWeight}), интересные факты, календарь клёва и нереста. Рыбы России и Башкортостана.`;
                const keywords = `${fishName}, ${fish.latin || ''}, ${fishFamily}, рыбы россии, рыбы башкортостана, рыбалка, ${fishHabitat}, календарь клёва, нерест, интересные факты, ${fish.status || ''}`;
                
                document.querySelector('meta[name="description"]').setAttribute('content', desc);
                document.querySelector('meta[name="keywords"]').setAttribute('content', keywords);
                
                // Open Graph
                document.querySelector('meta[property="og:title"]').setAttribute('content', `${fishName} — Рыбы России и Башкортостана`);
                document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
                document.querySelector('meta[property="og:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);
                
                // Twitter
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${fishName} — Рыбы России и Башкортостана`);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);
                document.querySelector('meta[name="twitter:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);

                let statusLabel = fish.status || 'Промысловая';
                let statusClass = 'tag-promyslovaya';
                if (statusLabel.includes('краснокнижная')) {
                    statusClass = 'tag-red';
                    statusLabel = 'Красная книга ⚠️';
                }

                // Формируем HTML для карусели
                let carouselHTML = '';
                const images = fish.images && fish.images.length > 0 ? fish.images : [fish.thumb || 'img/placeholder.jpg'];
                
                if (images.length === 1) {
                    carouselHTML = `
                        <div class="carousel-container" style="background:transparent;box-shadow:none;">
                            <img src="${images[0]}" alt="${fish.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;" onerror="this.src='img/placeholder.jpg'" />
                        </div>
                    `;
                } else {
                    carouselHTML = `
                        <div class="carousel-container" id="carouselContainer">
                            <div class="carousel-slides" id="carouselSlides">
                                ${images.map(img => `
                                    <div class="carousel-slide">
                                        <img src="${img}" alt="${fish.name}" loading="lazy" onerror="this.src='img/placeholder.jpg'" />
                                    </div>
                                `).join('')}
                            </div>
                            <button class="carousel-btn prev" onclick="changeSlide(-1)">‹</button>
                            <button class="carousel-btn next" onclick="changeSlide(1)">›</button>
                            <div class="carousel-dots" id="carouselDots">
                                ${images.map((_, idx) => `<button class="carousel-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></button>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // ===== ГЕНЕРАЦИЯ КАЛЕНДАРЕЙ =====
                function renderCalendar(dataArray, className) {
                    if (!dataArray || dataArray.length !== 12) return '<div style="color:#999;font-size:13px;">Данные не указаны</div>';
                    return `
                        <div class="calendar-row">
                            ${dataArray.map((val, idx) => `
                                <div class="calendar-month">
                                    <span class="month-label">${MONTHS_SHORT[idx]}</span>
                                    <div class="month-box ${val === 1 ? className : ''}"></div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                // ===== ГЕНЕРАЦИЯ БЛОКА "РЫБАЦКИЕ СЕКРЕТЫ" =====
                function renderSecrets(fish) {
                    if (!fish.bait && !fish.lure && !fish.tackle && !fish.technique && !fish.tips) return '';
                    
                    let secretsHTML = `<div class="fish-secrets"><h3>🎣 Рыбацкие секреты</h3>`;
                    
                    if (fish.bait && fish.bait.length > 0) {
                        secretsHTML += `
                            <div class="secret-block">
                                <div class="secret-label">🪝 На что клюёт:</div>
                                <div class="secret-tags">
                                    ${fish.bait.map(b => `<span class="secret-tag">${escapeHtml(b)}</span>`).join('')}
                                </div>
                            </div>
                        `;
                    }
                    
                    if (fish.lure) {
                        secretsHTML += `
                            <div class="secret-block">
                                <div class="secret-label">🏷️ Лучшие приманки:</div>
                                <div class="secret-value">${escapeHtml(fish.lure)}</div>
                            </div>
                        `;
                    }
                    
                    if (fish.tackle) {
                        secretsHTML += `
                            <div class="secret-block">
                                <div class="secret-label">🎣 Снасти:</div>
                                <div class="secret-value">${escapeHtml(fish.tackle)}</div>
                            </div>
                        `;
                    }
                    
                    if (fish.technique) {
                        secretsHTML += `
                            <div class="secret-block">
                                <div class="secret-label">📋 Техника:</div>
                                <div class="secret-value">${escapeHtml(fish.technique)}</div>
                            </div>
                        `;
                    }
                    
                    if (fish.tips) {
                        secretsHTML += `
                            <div class="secret-block">
                                <div class="secret-label">💡 Советы:</div>
                                <div class="secret-value">${escapeHtml(fish.tips)}</div>
                            </div>
                        `;
                    }
                    
                    secretsHTML += `</div>`;
                    return secretsHTML;
                }

                // ===== ГЕНЕРАЦИЯ FAQ =====
                function renderFaq(fish) {
                    let faqItems = [];
                    
                    if (fish.habitat && fish.habitat.length > 0) {
                        faqItems.push({
                            q: `Где водится ${fish.name}?`,
                            a: `${fish.name} встречается в водоёмах: ${fish.habitat.join(', ')}.`
                        });
                    }
                    
                    if (fish.status && fish.status.includes('краснокнижная')) {
                        faqItems.push({
                            q: `${fish.name} в Красной книге?`,
                            a: `Да, ${fish.name} занесена в Красную книгу Республики Башкортостан. Ловля запрещена!`
                        });
                    } else if (fish.status && fish.status.includes('промысловая')) {
                        faqItems.push({
                            q: `${fish.name} в Красной книге?`,
                            a: `Нет, ${fish.name} не занесена в Красную книгу. Это промысловая рыба.`
                        });
                    }
                    
                    if (fish.spawning) {
                        faqItems.push({
                            q: `Когда нерестится ${fish.name}?`,
                            a: `Нерест ${fish.name} происходит: ${fish.spawning}.`
                        });
                    }
                    
                    if (fish.size) {
                        faqItems.push({
                            q: `Какие размеры у ${fish.name}?`,
                            a: `${fish.name} может достигать размеров: ${fish.size}.`
                        });
                    }
                    
                    if (faqItems.length === 0) return '';
                    
                    return `
                        <div class="fish-faq">
                            <h3>❓ Частые вопросы</h3>
                            ${faqItems.map(item => `
                                <details class="faq-item">
                                    <summary>${escapeHtml(item.q)}</summary>
                                    <p>${escapeHtml(item.a)}</p>
                                </details>
                            `).join('')}
                        </div>
                    `;
                }

                // ===== СХЕМА.ORG (структурированные данные) =====
                function renderSchemaOrg(fish) {
                    const schema = {
                        "@context": "https://schema.org",
                        "@type": "Article",
                        "headline": `${fish.name} — Рыбы России и Башкортостана`,
                        "description": `Описание рыбы ${fish.name}: места обитания, размеры, интересные факты, календарь клёва и нереста.`,
                        "image": `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`,
                        "author": {
                            "@type": "Person",
                            "name": "Рыбы Башкортостана"
                        },
                        "publisher": {
                            "@type": "Organization",
                            "name": "Рыбы Башкортостана"
                        }
                    };
                    
                    return `<script type="application/ld+json">${JSON.stringify(schema)}<\/script>`;
                }

                // Собираем страницу
                pageContainer.innerHTML = `
                    <div class="fish-page-top">
                        <div class="fish-page-image">
                            ${carouselHTML}
                        </div>
                        <div class="fish-page-info">
                            <h1 class="fish-page-name">${fish.name}</h1>
                            <div class="fish-page-latin">${fish.latin || ''}</div>
                            <div class="fish-page-tags">
                                <span class="tag ${statusClass}">${statusLabel}</span>
                                <span class="tag">${fish.family || ''}</span>
                            </div>
                            <div class="fish-page-specs">
                                <div class="spec-item"><span class="spec-label">Размер</span><span class="spec-value">${fish.size || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Вес</span><span class="spec-value">${fish.weight || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Тип питания</span><span class="spec-value">${fish.diet || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Места обитания</span><span class="spec-value">${Array.isArray(fish.habitat) ? fish.habitat.join(', ') : '—'}</span></div>

                    </div>
                `;
            }
        }

        // ========== ЛОГИКА КАРУСЕЛИ ==========
        let currentSlide = 0;
        let totalSlides = 0;
        let slideInterval = null;

        function initCarousel(count) {
            totalSlides = count;
            updateCarousel();
            slideInterval = setInterval(() => changeSlide(1), 4000);
            const container = document.getElementById('carouselContainer');
            if (container) {
                container.addEventListener('mouseenter', () => clearInterval(slideInterval));
                container.addEventListener('mouseleave', () => {
                    slideInterval = setInterval(() => changeSlide(1), 4000);
                });
            }
        }

        function changeSlide(direction) {
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        function updateCarousel() {
            const slidesContainer = document.getElementById('carouselSlides');
            const dots = document.querySelectorAll('.carousel-dot');
            if (slidesContainer) {
                slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });
        }

        document.addEventListener('DOMContentLoaded', loadFishPage);
    </script>
