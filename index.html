    <style>
        /* Стили для карусели */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #e8ecf0;
        }
        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            z-index: 10;
        }
        .carousel-btn:hover {
            background: white;
        }
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel-dot.active {
            background: white;
        }
        .fish-page-image {
            flex: 0 0 45%;
        }
        @media (max-width: 820px) {
            .fish-page-top {
                flex-direction: column;
            }
            .fish-page-image {
                flex: unset;
            }
            .carousel-container {
                height: 280px;
            }
        }
        @media (max-width: 640px) {
            .carousel-container {
                height: 220px;
            }
            .carousel-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo" style="text-decoration:none;">
                    <span class="logo-icon">🐟</span>

    <main class="main-content">

    <script>
        // Названия месяцев для подписи кубиков
        const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

        function getFishId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadFishPage() {
            const fishId = getFishId();
            const pageContainer = document.getElementById('fishPage');
            
            if (!fishId) {
                pageContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Рыба не найдена</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('data/fishes.json');
                if (!response.ok) throw new Error(`Ошибка загрузки: ${response.status}`);
                const data = await response.json();
                const fish = data.fishes.find(f => f.id === fishId);

                if (!fish) {
                    pageContainer.innerHTML = `
                        <div style="text-align:center;padding:40px;">
                            <h2>⚠️ Рыба не найдена</h2>
                            <p style="color:#7a8a9a;">Вернитесь на <a href="index.html" style="color:#1a5276;font-weight:600;">главную страницу</a>.</p>
                        </div>
                    `;
                    return;
                }

                // Обновляем мета-теги динамически под конкретную рыбу
                document.title = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('pageTitle').textContent = `${fish.name} — Рыбы России и Башкортостана`;
                document.getElementById('breadcrumbFish').textContent = fish.name;

                // Расширенный description с учётом рыбы
                const fishName = fish.name || 'Рыба';
                const fishFamily = fish.family || '';
                const fishHabitat = Array.isArray(fish.habitat) ? fish.habitat.join(', ') : 'различные водоемы';
                const fishSize = fish.size || 'различные размеры';
                const fishWeight = fish.weight || 'различный вес';
                
                const desc = `${fishName} (${fish.latin || ''}) — описание, фото, места обитания (${fishHabitat}), размеры (${fishSize}), вес (${fishWeight}), интересные факты, календарь клёва и нереста. Рыбы России и Башкортостана.`;
                const keywords = `${fishName}, ${fish.latin || ''}, ${fishFamily}, рыбы россии, рыбы башкортостана, рыбалка, ${fishHabitat}, календарь клёва, нерест, интересные факты, ${fish.status || ''}`;
                
                document.querySelector('meta[name="description"]').setAttribute('content', desc);
                document.querySelector('meta[name="keywords"]').setAttribute('content', keywords);
                
                // Open Graph
                document.querySelector('meta[property="og:title"]').setAttribute('content', `${fishName} — Рыбы России и Башкортостана`);
                document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
                document.querySelector('meta[property="og:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);
                
                // Twitter
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${fishName} — Рыбы России и Башкортостана`);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);
                document.querySelector('meta[name="twitter:image"]').setAttribute('content', `https://almazbaymurzin.github.io/Bashkortostan_Fishes/${fish.thumb || 'img/placeholder.jpg'}`);

                let statusLabel = fish.status || 'Промысловая';
                let statusClass = 'tag-promyslovaya';
                if (statusLabel.includes('краснокнижная')) {
                    statusClass = 'tag-red';
                    statusLabel = 'Красная книга ⚠️';
                }

                // Формируем HTML для карусели
                let carouselHTML = '';
                const images = fish.images && fish.images.length > 0 ? fish.images : [fish.thumb || 'img/placeholder.jpg'];
                
                if (images.length === 1) {
                    carouselHTML = `
                        <div class="carousel-container" style="background:transparent;box-shadow:none;">
                            <img src="${images[0]}" alt="${fish.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;" onerror="this.src='img/placeholder.jpg'" />
                        </div>
                    `;
                } else {
                    carouselHTML = `
                        <div class="carousel-container" id="carouselContainer">
                            <div class="carousel-slides" id="carouselSlides">
                                ${images.map(img => `
                                    <div class="carousel-slide">
                                        <img src="${img}" alt="${fish.name}" loading="lazy" onerror="this.src='img/placeholder.jpg'" />
                                    </div>
                                `).join('')}
                            </div>
                            <button class="carousel-btn prev" onclick="changeSlide(-1)">‹</button>
                            <button class="carousel-btn next" onclick="changeSlide(1)">›</button>
                            <div class="carousel-dots" id="carouselDots">
                                ${images.map((_, idx) => `<button class="carousel-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></button>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // ===== ГЕНЕРАЦИЯ КАЛЕНДАРЕЙ =====
                function renderCalendar(dataArray, className) {
                    if (!dataArray || dataArray.length !== 12) return '<div style="color:#999;font-size:13px;">Данные не указаны</div>';
                    return `
                        <div class="calendar-row">
                            ${dataArray.map((val, idx) => `
                                <div class="calendar-month">
                                    <span class="month-label">${MONTHS_SHORT[idx]}</span>
                                    <div class="month-box ${val === 1 ? className : ''}"></div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                pageContainer.innerHTML = `
                    <div class="fish-page-top">
                        <div class="fish-page-image">
                            ${carouselHTML}
                        </div>
                        <div class="fish-page-info">
                            <h1 class="fish-page-name">${fish.name}</h1>
                            <div class="fish-page-latin">${fish.latin || ''}</div>
                            <div class="fish-page-tags">
                                <span class="tag ${statusClass}">${statusLabel}</span>
                                <span class="tag">${fish.family || ''}</span>
                            </div>
                            <div class="fish-page-specs">
                                <div class="spec-item"><span class="spec-label">Размер</span><span class="spec-value">${fish.size || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Вес</span><span class="spec-value">${fish.weight || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Тип питания</span><span class="spec-value">${fish.diet || '—'}</span></div>
                                <div class="spec-item"><span class="spec-label">Места обитания</span><span class="spec-value">${Array.isArray(fish.habitat) ? fish.habitat.join(', ') : '—'}</span></div>
                                ${fish.max_length ? `<div class="spec-item"><span class="spec-label">Макс. длина</span><span class="spec-value">${fish.max_length}</span></div>` : ''}
                                ${fish.max_weight ? `<div class="spec-item"><span class="spec-label">Макс. вес</span><span class="spec-value">${fish.max_weight}</span></div>` : ''}
                            </div>

                            <!-- ===== КАЛЕНДАРИ ===== -->
                            <div class="fish-calendars">
                                <div class="fish-calendar-block">
                                    <h4>🎣 Когда ловится</h4>
                                    ${renderCalendar(fish.activity, 'activity-on')}
                                    <div class="calendar-legend">
                                        <span><span class="dot green"></span> Клёв</span>
                                        <span><span class="dot gray"></span> Не сезон</span>
                                    </div>
                                </div>
                                <div class="fish-calendar-block">
                                    <h4>🟠 Нерест</h4>
                                    ${renderCalendar(fish.spawn, 'spawn-on')}
                                    <div class="calendar-legend">
                                        <span><span class="dot red"></span> Нерест</span>
                                        <span><span class="dot gray"></span> Не сезон</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${fish.funFacts && fish.funFacts.length > 0 ? `
                    <div class="fish-facts">
                        <h4>💡 Интересные факты</h4>
                        <ul>
                            ${fish.funFacts.map(fact => `<li>${fact}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}

                    <div style="margin-top:24px;">
                        <a href="index.html" style="display:inline-block;padding:10px 28px;background:#f0f2f5;border-radius:30px;color:#1a1a1a;font-weight:600;text-decoration:none;transition:background 0.2s;" 
                           onmouseover="this.style.background='#e0e4e8'" 
                           onmouseout="this.style.background='#f0f2f5'">
                            ← Назад к списку
                        </a>
                    </div>
                `;

                // Инициализация карусели
                if (images.length > 1) {
                    initCarousel(images.length);
                }

            } catch (error) {
                console.error('❌ Ошибка:', error);
                pageContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2>⚠️ Ошибка загрузки</h2>
                        <p style="color:#7a8a9a;">Пожалуйста, попробуйте позже.</p>
                        <p style="color:#999;font-size:14px;margin-top:8px;">${error.message}</p>
                    </div>
                `;
            }
        }

        // ========== ЛОГИКА КАРУСЕЛИ ==========
        let currentSlide = 0;
        let totalSlides = 0;
        let slideInterval = null;

        function initCarousel(count) {
            totalSlides = count;
            updateCarousel();
            slideInterval = setInterval(() => changeSlide(1), 4000);
            const container = document.getElementById('carouselContainer');
            if (container) {
                container.addEventListener('mouseenter', () => clearInterval(slideInterval));
                container.addEventListener('mouseleave', () => {
                    slideInterval = setInterval(() => changeSlide(1), 4000);
                });
            }
        }

        function changeSlide(direction) {
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        function updateCarousel() {
            const slidesContainer = document.getElementById('carouselSlides');
            const dots = document.querySelectorAll('.carousel-dot');
            if (slidesContainer) {
                slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });
        }

        document.addEventListener('DOMContentLoaded', loadFishPage);
    </script>
